server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /search {
        proxy_pass http://dinasti-api:3001/search;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # IDS mode re-explores from scratch at every depth (by design, not a
        # bug — it's how iterative deepening works), so a distant topic pair
        # can legitimately take minutes. BFS is much faster for the same pair.
        proxy_read_timeout 280s;
    }
}
