# Conservative prefork limits for a low-traffic portfolio demo on a
# resource-constrained shared VPS — the php:8.3-apache image's stock
# defaults let dozens of workers spawn under any concurrent load, each
# holding its own DB connection, which starves the rest of the box.
<IfModule mpm_prefork_module>
    StartServers          2
    MinSpareServers        2
    MaxSpareServers         4
    MaxRequestWorkers      12
    MaxConnectionsPerChild 500
</IfModule>
