server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://if3310-api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    location /store/ {
        proxy_pass http://if3310-api:3000/store/;
        proxy_set_header Host $host;
    }

    # The backend's WebSocket server is a bare ws.Server on its own port
    # (3310-tubes/backend/src/utils/websocket.ts), not routed through the
    # Express app — proxy it under a dedicated path since / is the SPA.
    location /ws {
        proxy_pass http://if3310-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s; # long-lived chat socket
    }
}
